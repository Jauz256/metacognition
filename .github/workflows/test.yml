name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: the watchdog and the installer
        run: bash tests/run.sh
      - name: the loop scan, the picture, and every agent home
        run: bash tests/run-tools.sh
      - name: the installer changes nothing in a dry run
        run: bash install.sh --dry-run
