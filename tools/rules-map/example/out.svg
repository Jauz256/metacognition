<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2050" viewBox="0 0 2200 2050" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8A8F98"/></marker></defs>
<rect width="100%" height="100%" fill="#0B0E14"/>
<text x="60" y="80" fill="#F2F0EA" font-size="46" font-weight="900">Every rule, on the step where it applies</text>
<text x="60" y="128" fill="#C9CCD3" font-size="24">10 rules. 5 have a check that runs. 5 are only notes. 1 broke today. 1 not placed yet.</text>
<text x="60" y="168" fill="#C9CCD3" font-size="22">Left: the steps of one piece of work, top to bottom. Each card is one rule, wired to its step. Green card = a check in claims.tsv enforces it. Grey card = written down only. Red ring = its check failed in the last verdict.</text>
<text x="740" y="260" fill="#56C271" font-size="28" font-weight="900">A check enforces it (5)</text>
<text x="1460" y="260" fill="#8A8F98" font-size="28" font-weight="900">Only a note (5)</text>
<g class="step" data-step="1">
<rect x="100" y="340" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="392" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">1. read the ask</text>
<text x="330" y="454" text-anchor="middle" fill="#0B0E14" font-size="18">1 rules</text>
</g>
<path d="M560,405 C650,405 1370,350 1460,350" fill="none" stroke="#3A3F4C" stroke-width="2" opacity="0.9"/>
<rect class="rule note" data-id="clarify-request-before-any-change" data-step="1" x="1460" y="320" width="620" height="60" rx="9" fill="#1E2230" stroke="#0B0E14" stroke-width="2"/>
<text x="1472" y="342" fill="#D9DCE3" font-size="17">Clarify the request before any change that touches more than three</text>
<text x="1472" y="364" fill="#D9DCE3" font-size="17">files.</text>
<g class="step" data-step="2">
<rect x="100" y="570" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="622" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">2. plan</text>
<text x="330" y="684" text-anchor="middle" fill="#0B0E14" font-size="18">1 rules</text>
</g>
<path d="M330,470 L330,570" stroke="#8A8F98" stroke-width="5" marker-end="url(#ar)"/>
<path d="M560,635 C650,635 1370,580 1460,580" fill="none" stroke="#3A3F4C" stroke-width="2" opacity="0.9"/>
<rect class="rule note" data-id="restate-goal-one-wait-yes" data-step="2" x="1460" y="550" width="620" height="60" rx="9" fill="#1E2230" stroke="#0B0E14" stroke-width="2"/>
<text x="1472" y="572" fill="#D9DCE3" font-size="17">Restate the goal in one line and wait for a yes before a big build.</text>
<g class="step" data-step="3">
<rect x="100" y="800" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="852" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">3. build</text>
<text x="330" y="914" text-anchor="middle" fill="#0B0E14" font-size="18">2 rules</text>
</g>
<path d="M330,700 L330,800" stroke="#8A8F98" stroke-width="5" marker-end="url(#ar)"/>
<path d="M560,865 C650,865 650,810 740,810" fill="none" stroke="#56C271" stroke-width="2" opacity="0.9"/>
<rect class="rule mechanism" data-id="dependencies-minimal-add-package-standard" data-step="3" x="740" y="780" width="620" height="60" rx="9" fill="#163B2A" stroke="#0B0E14" stroke-width="2"/>
<text x="752" y="802" fill="#BFF0CF" font-size="17">Keep dependencies minimal; do not add a package when the standa...</text>
<text x="752" y="826" font-size="15"><tspan fill="#56C271">check: </tspan><tspan fill="#56C271">few-dependencies</tspan></text>
<path d="M560,865 C650,865 650,880 740,880" fill="none" stroke="#56C271" stroke-width="2" opacity="0.9"/>
<rect class="rule mechanism" data-id="leave-console-log-debug-statements" data-step="3" x="740" y="850" width="620" height="60" rx="9" fill="#163B2A" stroke="#0B0E14" stroke-width="2"/>
<text x="752" y="872" fill="#BFF0CF" font-size="17">Never leave console.log or debug statements in shipped code.</text>
<text x="752" y="896" font-size="15"><tspan fill="#56C271">check: </tspan><tspan fill="#56C271">no-debug-statements</tspan></text>
<g class="step" data-step="4">
<rect x="100" y="1030" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="1082" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">4. verify</text>
<text x="330" y="1144" text-anchor="middle" fill="#0B0E14" font-size="18">1 rules</text>
</g>
<path d="M330,930 L330,1030" stroke="#8A8F98" stroke-width="5" marker-end="url(#ar)"/>
<path d="M560,1095 C650,1095 650,1040 740,1040" fill="none" stroke="#E8503A" stroke-width="2" opacity="0.9"/>
<rect class="rule mechanism broken" data-id="run-lint-typecheck-before-commit" data-step="4" x="740" y="1010" width="620" height="60" rx="9" fill="#163B2A" stroke="#E8503A" stroke-width="4"/>
<text x="752" y="1032" fill="#BFF0CF" font-size="17">Run lint and typecheck before every commit.</text>
<text x="752" y="1056" font-size="15"><tspan fill="#56C271">check: </tspan><tspan fill="#56C271">lint-clean</tspan>, <tspan fill="#E8503A">typecheck-clean RED</tspan></text>
<g class="step" data-step="5">
<rect x="100" y="1260" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="1312" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">5. show</text>
<text x="330" y="1374" text-anchor="middle" fill="#0B0E14" font-size="18">3 rules</text>
</g>
<path d="M330,1160 L330,1260" stroke="#8A8F98" stroke-width="5" marker-end="url(#ar)"/>
<path d="M560,1325 C650,1325 650,1270 740,1270" fill="none" stroke="#56C271" stroke-width="2" opacity="0.9"/>
<rect class="rule mechanism" data-id="commit-atomically-message-names-change" data-step="5" x="740" y="1240" width="620" height="60" rx="9" fill="#163B2A" stroke="#0B0E14" stroke-width="2"/>
<text x="752" y="1262" fill="#BFF0CF" font-size="17">Commit atomically, with a message that names the change.</text>
<text x="752" y="1286" font-size="15"><tspan fill="#56C271">check: </tspan><tspan fill="#56C271">atomic-commits</tspan></text>
<path d="M560,1325 C650,1325 650,1340 740,1340" fill="none" stroke="#56C271" stroke-width="2" opacity="0.9"/>
<rect class="rule mechanism" data-id="say-without-pasting-command-proves" data-step="5" x="740" y="1310" width="620" height="60" rx="9" fill="#163B2A" stroke="#0B0E14" stroke-width="2"/>
<text x="752" y="1332" fill="#BFF0CF" font-size="17">Never say &quot;done&quot; without pasting the command that proves it.</text>
<text x="752" y="1356" font-size="15"><tspan fill="#56C271">check: </tspan><tspan fill="#56C271">proof-in-done</tspan></text>
<path d="M560,1325 C650,1325 1370,1270 1460,1270" fill="none" stroke="#3A3F4C" stroke-width="2" opacity="0.9"/>
<rect class="rule note" data-id="answer-details-second-reply-answer" data-step="5" x="1460" y="1240" width="620" height="60" rx="9" fill="#1E2230" stroke="#0B0E14" stroke-width="2"/>
<text x="1472" y="1262" fill="#D9DCE3" font-size="17">Answer first, details second: the first line of a reply is the</text>
<text x="1472" y="1284" fill="#D9DCE3" font-size="17">answer.</text>
<g class="step" data-step="6">
<rect x="100" y="1490" width="460" height="130" rx="16" fill="#F2F0EA" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="1542" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">6. learn</text>
<text x="330" y="1604" text-anchor="middle" fill="#0B0E14" font-size="18">1 rules</text>
</g>
<path d="M330,1390 L330,1490" stroke="#8A8F98" stroke-width="5" marker-end="url(#ar)"/>
<path d="M560,1555 C650,1555 1370,1500 1460,1500" fill="none" stroke="#3A3F4C" stroke-width="2" opacity="0.9"/>
<rect class="rule note" data-id="correction-comes-write-down-comment" data-step="6" x="1460" y="1470" width="620" height="60" rx="9" fill="#1E2230" stroke="#0B0E14" stroke-width="2"/>
<text x="1472" y="1492" fill="#D9DCE3" font-size="17">When the same correction comes twice, write it down as a rule, not a</text>
<text x="1472" y="1514" fill="#D9DCE3" font-size="17">comment.</text>
<g class="step" data-step="0">
<rect x="100" y="1720" width="460" height="130" rx="16" fill="#E8503A" stroke="#0B0E14" stroke-width="3"/>
<text x="330" y="1772" text-anchor="middle" fill="#0B0E14" font-size="28" font-weight="900">0. not placed yet</text>
<text x="330" y="1834" text-anchor="middle" fill="#0B0E14" font-size="18">1 rules</text>
</g>
<path d="M560,1785 C650,1785 1370,1730 1460,1730" fill="none" stroke="#3A3F4C" stroke-width="2" opacity="0.9"/>
<rect class="rule note" data-id="direct-filler-words" data-step="0" x="1460" y="1700" width="620" height="60" rx="9" fill="#1E2230" stroke="#0B0E14" stroke-width="2"/>
<text x="1472" y="1722" fill="#D9DCE3" font-size="17">Be direct. No filler words.</text>
<text x="60" y="2010" fill="#8A8F98" font-size="20">Last verdict: 2026-09-07T10:30:00Z. Not placed yet: pin them to a step in placement.json.</text>
</svg>